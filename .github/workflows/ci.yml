name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure git
        run: git config --global core.autocrlf false

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain versions
        run: moon version --all

      - name: Refresh registry and dependencies
        run: moon update

      - name: Format check
        run: moon check --fmt

      - name: Type check all targets
        run: moon check --target all

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            flag: linux
          - name: macOS
            os: macos-latest
            flag: macos
          - name: Windows
            os: windows-latest
            flag: windows
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure git
        run: git config --global core.autocrlf false

      - name: Set up MoonBit (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Set up MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Show toolchain versions
        run: moon version --all

      - name: Refresh registry and dependencies
        run: moon update

      - name: Run tests with coverage
        run: |
          moon coverage clean
          moon test --enable-coverage

      - name: Verify 100% coverage
        run: |
          mkdir -p coverage
          moon coverage report -f summary | tee "coverage/${{ matrix.flag }}-summary.txt"
          python - <<'PY'
          import pathlib
          import re

          summary = pathlib.Path("coverage/${{ matrix.flag }}-summary.txt").read_text(encoding="utf-8")
          match = re.search(r"Total:\s+(\d+)/(\d+)", summary)
          if not match:
              raise SystemExit("coverage summary did not contain a Total line")
          covered, total = map(int, match.groups())
          if covered != total:
              raise SystemExit(f"coverage is not 100%: {covered}/{total}")
          PY

      - name: Build Codecov report
        run: moon coverage report -f coveralls -o "coverage/${{ matrix.flag }}.json"

      - name: Normalize Codecov paths
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path("coverage/${{ matrix.flag }}.json")
          text = path.read_text(encoding="utf-8")

          def normalize_name(match):
              prefix, name, suffix = match.groups()
              return f"{prefix}{name.replace(chr(92), '/')}{suffix}"

          normalized = re.sub(r'("name"\s*:\s*")([^"]*)(")', normalize_name, text)
          json.loads(normalized)
          path.write_text(normalized, encoding="utf-8")
          PY

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          disable_search: true
          fail_ci_if_error: true
          files: coverage/${{ matrix.flag }}.json
          flags: ${{ matrix.flag }}
          name: ${{ matrix.flag }}
          use_oidc: true
          verbose: true
